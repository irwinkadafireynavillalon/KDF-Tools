<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador KDF · Escudo Anti-Tracking & Sanitizador</title>
  <style>
    :root {
      --bg: #050608;
      --card-bg: rgba(14, 16, 26, 0.94);
      --gold: #ffd700;
      --gold-dark: #d4af37;
      --silver: #e0e2ec;
      --purple: #9b4dff;
      --danger: #ff3366;
      --success: #00ff88;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: var(--bg);
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: rgba(10, 12, 20, 0.98);
      padding: 12px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      border-bottom: 2px solid;
      border-image: linear-gradient(90deg, var(--gold) 0%, var(--purple) 50%, var(--silver) 100%) 1;
    }
    .brand {
      font-weight: 800;
      background: linear-gradient(135deg, var(--gold), var(--purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-size: 1.15rem;
      white-space: nowrap;
    }
    .url-bar-container {
      flex: 1;
      display: flex;
      align-items: center;
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--purple);
      border-radius: 24px;
      padding: 6px 16px;
      gap: 10px;
      transition: all 0.3s;
    }
    .url-bar-container:focus-within {
      border-color: var(--gold);
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.35);
    }
    .shield-icon {
      font-size: 1.1rem;
      cursor: pointer;
    }
    input#url-input {
      flex: 1;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
    }
    button.btn-go {
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      border: none;
      color: #000;
      font-weight: 700;
      padding: 8px 16px;
      border-radius: 18px;
      cursor: pointer;
    }
    .alert-banner {
      display: none;
      background: rgba(255, 51, 102, 0.15);
      border-bottom: 1px solid var(--danger);
      padding: 10px 20px;
      font-size: 0.88rem;
      color: #ffccd5;
      justify-content: space-between;
      align-items: center;
    }
    .alert-banner.active { display: flex; }
    .alert-banner strong { color: var(--danger); }
    .browser-view {
      flex: 1;
      width: 100%;
      border: none;
      background: #fff;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">🌐 NAVEGADOR KDF</div>
    <div class="url-bar-container">
      <span class="shield-icon" id="shield-status" title="Escudo Anti-Rastreo Activo">🛡️</span>
      <input type="text" id="url-input" placeholder="Escribe una URL o busca..." value="https://accounts.google.com/SignOutOptions?hl=en&continue=https://antigravity.google.com/u/0/r/39b58375-c71a-4e33-a9ef-10290d25fef3-v2&ec=GBRAgQY">
      <button class="btn-go" onclick="navigate()">Navegar</button>
    </div>
  </header>

  <div class="alert-banner" id="alert-banner">
    <div id="alert-text">⚠️ <strong>ALERTA DE SEGURIDAD KDF:</strong> URL inflada con tokens de rastreo detectada. Sanitizada automáticamente a la versión oficial limpia.</div>
    <button onclick="document.getElementById('alert-banner').classList.remove('active')" style="background:none; border:none; color:#fff; cursor:pointer;">✖</button>
  </div>

  <iframe class="browser-view" id="web-frame" src="about:blank"></iframe>

  <script>
    function navigate() {
      const inp = document.getElementById('url-input');
      let target = inp.value.trim();
      if (!target.startsWith('http://') && !target.startsWith('https://')) {
        target = 'https://' + target;
      }

      // Enviar al motor sanitizador local de KDF
      fetch('/api/browser/sanitize', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: target })
      })
      .then(r => r.json())
      .then(data => {
        if (data.is_suspicious) {
          const banner = document.getElementById('alert-banner');
          banner.classList.add('active');
          document.getElementById('shield-status').innerText = '🚨';
          inp.value = data.purified_url;
          document.getElementById('web-frame').src = data.purified_url;
        } else {
          document.getElementById('alert-banner').classList.remove('active');
          document.getElementById('shield-status').innerText = '🛡️';
          inp.value = data.purified_url;
          document.getElementById('web-frame').src = data.purified_url;
        }
      })
      .catch(() => {
        document.getElementById('web-frame').src = target;
      });
    }
  </script>
</body>
</html>
