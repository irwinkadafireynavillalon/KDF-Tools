name: KDF-Tools CI/CD & Build Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-test:
    name: Build Android APK & Run Diagnostics
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Inject Google AI Studio Secret
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > kdf-tools_extracted/.env
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Validate Python Suite Syntax
        run: |
          python3 -m py_compile app.py kdf_optimizer_core.py kdf_security_core.py kdf_url_sanitizer.py
          echo "✓ Python core syntax verified"

      - name: Validate StressLab Scripts
        run: |
          python3 -m py_compile stress_lab/harness_cli/kdf_stress_runner.py
          echo "✓ KDF-StressLab runner verified"

      - name: Build Android APK (Debug)
        working-directory: kdf-tools_extracted
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Package & Prepare APK
        run: |
          mkdir -p dist_apk
          find kdf-tools_extracted/app/build/outputs/apk/ -name "*.apk" -exec cp {} dist_apk/KDF-Tools-LuX.apk \;
          ls -la dist_apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KDF-Tools-APK
          path: dist_apk/KDF-Tools-LuX.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.5.0-LuX
          name: "⚡ KDF-Tools v2.5.0-LuX (Android APK)"
          draft: false
          prerelease: false
          body: |
            ### ⚡ KDF-Tools Universal Suite · Android APK
            Compilado automáticamente desde el ecosistema Google AI Studio.
            
            #### 📥 Instalación:
            1. Descarga el archivo adjunto `KDF-Tools-LuX.apk` a tu teléfono Android.
            2. Abre el archivo descargado para instalarlo.
            3. Si el sistema lo solicita, autoriza "Instalar aplicaciones de fuentes desconocidas".
          files: dist_apk/KDF-Tools-LuX.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
