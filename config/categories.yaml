# config/categories.yaml - Taxonomía Universal KDF-Tools (Edición Mewtwo)
# Categorías de Dispositivos y Catálogo Completo de Operaciones y Herramientas

categories:
  - id: smartphones
    name: "📱 Smartphones / Móviles"
    description: "Diagnóstico, recuperación, desbloqueo y flasheo de teléfonos móviles"
    brands:
      - name: "Motorola"
        processors: ["MediaTek (Helio)", "Qualcomm (Snapdragon)", "Unisoc"]
        models: ["Moto G Series (Universal)", "Edge Series", "Razr Series", "Moto E Series", "Moto G24"]
      - name: "Xiaomi / Redmi / POCO"
        processors: ["Qualcomm (Snapdragon)", "MediaTek (Dimensity/Helio)"]
        models: ["Redmi Note 13", "Redmi Note 12", "POCO X6 Pro", "POCO F5", "Xiaomi 14"]
      - name: "Samsung"
        processors: ["Exynos", "Qualcomm (Snapdragon)", "MediaTek"]
        models: ["Galaxy A54", "Galaxy A34", "Galaxy S23/S24", "Galaxy A14", "Galaxy Z Flip"]
      - name: "OPPO / Realme / Vivo / OnePlus"
        processors: ["MediaTek", "Qualcomm"]
        models: ["Realme 11 Pro", "OPPO Reno 10", "Vivo V29", "OnePlus Nord 3"]
      - name: "Apple (iPhone)"
        processors: ["Apple Silicon A-Series"]
        models: ["iPhone 15/15 Pro", "iPhone 14", "iPhone 13", "iPhone SE", "iPhone X/8/7"]

  - id: tablets
    name: "📲 Tablets & iPads"
    description: "Sistemas para tablets Android, iPadOS y tabletas Windows"
    brands:
      - name: "Samsung Galaxy Tab"
        processors: ["Qualcomm", "Exynos"]
      - name: "Lenovo Tab"
        processors: ["MediaTek", "Qualcomm"]
      - name: "Apple iPad"
        processors: ["Apple Silicon M-Series / A-Series"]
      - name: "Xiaomi Pad"
        processors: ["Qualcomm (Snapdragon)"]
      - name: "Amazon Fire HD"
        processors: ["MediaTek"]

  - id: pcs_laptops
    name: "💻 Computadoras & Laptops"
    description: "Herramientas de particionado, medios booteables y recuperación de sistema"
    brands:
      - name: "PC / Laptops Genéricas (Windows / Linux)"
        processors: ["Intel Core / Xeon (x86_64)", "AMD Ryzen (x86_64)"]
      - name: "Apple Mac / MacBook"
        processors: ["Apple Silicon (M1/M2/M3/M4)", "Intel Core"]

  - id: smart_tvs
    name: "📺 Smart TVs & TV Boxes"
    description: "Diagnóstico y gestión de dispositivos de televisión y streaming"
    brands:
      - name: "Android TV / Google TV (Xiaomi TV, TCL, Sony, Chromecast)"
        processors: ["Amlogic", "MediaTek", "Realtek"]
      - name: "Amazon Fire TV Stick / Cube"
        processors: ["MediaTek"]
      - name: "Smart TV Samsung (Tizen) & LG (webOS)"
        processors: ["ARM Propietario"]

  - id: smartwatches
    name: "⌚ Smartwatch & Wearables"
    description: "Relojes inteligentes y pulseras cuantificadoras"
    brands:
      - name: "Wear OS (Samsung Galaxy Watch, Pixel Watch, TicWatch)"
        processors: ["Exynos W", "Snapdragon Wear"]
      - name: "Apple Watch"
        processors: ["Apple Silicon S-Series"]

  - id: automotive
    name: "🚗 Sistemas Automotrices & Infotainment"
    description: "Sistemas Android Auto, consolas de infoentretenimiento y emuladores"
    brands:
      - name: "Unidades Android Auto / CarPlay Aftermarket"
        processors: ["Allwinner T3/T5", "Rockchip PX5/PX6", "UIS7862 Unisoc"]
      - name: "Sistemas Embebidos Originales (OEM Head Units)"
        processors: ["NXP i.MX", "Renesas", "Qualcomm Snapdragon Automotive"]

operations:
  # ─── 1. SEGURIDAD, DESBLOQUEO & FINANCE BYPASS ─────────────────────────────
  - id: payjoy_unlock
    name: "🔓 Desbloqueo PayJoy / Peyo / Finance Lock"
    category: "Desbloqueo Avanzado"
    critical: true
    description: "Bypass permanente y purga de aplicaciones de bloqueo crediticio y Knox Guard"
    script: "scripts/payjoy_unlock.sh"

  - id: app_blocker
    name: "🚫 Desactivar / Eliminar App Bloqueadora"
    category: "Mantenimiento"
    critical: false
    description: "Desactiva o desinstala apps que impiden el uso normal con opción a wipe"
    script: "scripts/disable_blocker.sh"

  - id: mode_safe
    name: "🦺 Gestión de Modo Seguro (Safe Mode)"
    category: "Mantenimiento"
    critical: false
    description: "Fuerza el arranque en modo seguro para evadir bloqueos activos de terceros"
    script: "scripts/enter_safe_mode.sh"

  - id: bootloader_unlock
    name: "🔓 Desbloqueo de Bootloader Universal"
    category: "Desbloqueo Avanzado"
    critical: true
    description: "Secuencia y comandos OEM/Fastboot por marca con verificación de ARB"
    script: "scripts/bootloader_unlock.sh"

  - id: icloud_bypass
    name: "🍏 Asistente Bypass iCloud / Apple DFU"
    category: "Apple / iOS"
    critical: true
    description: "Diagnóstico en modo DFU / Recovery y asistente Checkm8 para iOS"
    script: "scripts/icloud_bypass.sh"

  - id: imei_repair
    name: "📶 Reparación / Restauración de IMEI & NV"
    category: "Radiofrecuencia / NV"
    critical: true
    description: "Restauración de particiones NVRAM/NVDATA y reparación de baseband/señal"
    script: "scripts/imei_repair.sh"

  - id: nh_root_tool
    name: "⚡ NH Root / Magisk / KernelSU Engine"
    category: "Root & Privilegios"
    critical: true
    description: "Automatización de parchado de boot.img, inyección de KernelSU y Magisk"
    script: "scripts/nh_root_tool.sh"

  - id: mitool_service
    name: "🦊 MiTool Service (Xiaomi / Redmi / POCO)"
    category: "Xiaomi Service"
    critical: true
    description: "Verificación Anti-Rollback (ARB), flasheo EDL/Fastboot y cuenta Mi"
    script: "scripts/mitool_service.sh"

  # ─── 2. REPARACIÓN & FLASHEO DE FIRMWARE ──────────────────────────────────
  - id: unbrick_bootloop
    name: "🔧 Desbrickeo y Reparación de Bootloop"
    category: "Reparación"
    critical: true
    description: "Recupera dispositivos en bootloop constante o congelados en logo"
    script: "scripts/unbrick_recovery.sh"

  - id: flash_moto_g24
    name: "📲 Flasheo Rápido Motorola Moto G24"
    category: "Reparación"
    critical: true
    description: "Flasheo automatizado para compilación UTAS34.82-126-5 (canal altmx)"
    script: "scripts/flash_moto_g24.sh"

  - id: flash_stock_firmware
    name: "⚡ Flasheo de Firmware Original (Stock ROM)"
    category: "Flasheo"
    critical: true
    description: "Reinstalación limpia del firmware oficial de fábrica sin errores"
    script: "scripts/download_manager.sh"

  - id: flash_aosp_custom
    name: "🚀 Flasheo AOSP / GSI (Android 15/16/17)"
    category: "Flasheo"
    critical: true
    description: "Instala imágenes GSI Treble arm64_ab con capa del sistema"
    script: "scripts/flash_aosp_gsi.sh"

  - id: edl_flasher
    name: "⚡ Flasher EDL 9008 / BROM Bajo Nivel"
    category: "Bajo Nivel"
    critical: true
    description: "Diagnóstico y comunicación con puertos de emergencia Qualcomm 9008 y MediaTek BROM"
    script: "scripts/edl_flasher.sh"

  - id: low_level_tools
    name: "⚙️ Herramientas de Bajo Nivel (Fastboot/EDL/Test-Point)"
    category: "Bajo Nivel"
    critical: false
    description: "Acceso y diagnóstico por puertos de emergencia cuando el equipo no enciende"
    script: "scripts/low_level_diagnostic.sh"

  # ─── 3. MANTENIMIENTO, PARTICIONES & UTILIDADES ────────────────────────────
  - id: mem_cleaner
    name: "🧹 Limpieza de Memoria y Cachés"
    category: "Mantenimiento"
    critical: false
    description: "Limpia cachés de sistema y Dalvik vía ADB, con opción opcional a fastboot -w"
    script: "scripts/clean_memory.sh"

  - id: partition_backup
    name: "🛡️ Respaldo de Particiones Críticas"
    category: "Seguridad"
    critical: false
    description: "Respalda particiones críticas (boot, persist, modem, efs) antes de modificar"
    script: "scripts/backup_partitions.sh"

  - id: usb_boot_creator
    name: "💾 Creador de Medios USB Booteables"
    category: "Utilidades"
    critical: true
    description: "Convierte imágenes ISO en unidades de arranque para PC, laptops y consolas"
    script: "scripts/create_usb_boot.sh"

  - id: connectivity_diagnostics
    name: "📡 Diagnóstico de Conectividad (ADB/OTG/Wi-Fi)"
    category: "Diagnóstico"
    critical: false
    description: "Verifica puertos de comunicación, drivers, puente de red y protocolos"
    script: "scripts/diagnose_connectivity.sh"

  - id: return_home
    name: "🔄 Reinicio Normal a Estado Operativo"
    category: "Utilidades"
    critical: false
    description: "Reinicia el dispositivo a su estado operativo habitual de forma segura"
    script: "scripts/return_home.sh"
