<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgVortex" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2D114D"/>
      <stop offset="60%" stop-color="#140A24"/>
      <stop offset="100%" stop-color="#0B0D14"/>
    </radialGradient>

    <!-- Mewtwo Psychic Core Gradient -->
    <radialGradient id="psychicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E0B0FF"/>
      <stop offset="55%" stop-color="#9B51E0"/>
      <stop offset="85%" stop-color="#6A1B9A"/>
      <stop offset="100%" stop-color="#4A148C" stop-opacity="0"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#996515"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>

    <!-- Metallic Silver Gradient -->
    <linearGradient id="silverGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Purple Mewtwo Accent -->
    <linearGradient id="mewtwoAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7B1FA2"/>
      <stop offset="50%" stop-color="#BF55EC"/>
      <stop offset="100%" stop-color="#9B51E0"/>
    </linearGradient>

    <filter id="mewtwoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Ring Base -->
  <circle cx="256" cy="256" r="236" fill="url(#bgVortex)" stroke="url(#silverGradient)" stroke-width="6"/>
  <circle cx="256" cy="256" r="224" fill="none" stroke="url(#goldGradient)" stroke-width="4"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#9B51E0" stroke-width="2" stroke-dasharray="8 6"/>

  <!-- Geometric Hexagon Shield -->
  <polygon points="256,76 412,166 412,346 256,436 100,346 100,166" 
           fill="none" stroke="url(#goldGradient)" stroke-width="5" filter="url(#mewtwoGlow)"/>
  
  <polygon points="256,92 398,174 398,338 256,420 114,338 114,174" 
           fill="none" stroke="url(#silverGradient)" stroke-width="2" opacity="0.8"/>

  <!-- Psychic Energy Rays -->
  <line x1="256" y1="92" x2="256" y2="420" stroke="url(#mewtwoAccent)" stroke-width="2" opacity="0.6"/>
  <line x1="114" y1="174" x2="398" y2="338" stroke="url(#mewtwoAccent)" stroke-width="2" opacity="0.6"/>
  <line x1="114" y1="338" x2="398" y2="174" stroke="url(#mewtwoAccent)" stroke-width="2" opacity="0.6"/>

  <!-- Mewtwo Psychic Core Aura -->
  <circle cx="256" cy="256" r="110" fill="url(#psychicGlow)" filter="url(#mewtwoGlow)"/>

  <!-- Stylized Emblem / Monogram -->
  <g id="kdf-logo-emblem">
    <!-- KDF Monogram in Silver & Gold -->
    <path d="M 180 200 L 210 200 L 210 312 L 180 312 Z" fill="url(#silverGradient)"/>
    <path d="M 210 256 L 250 200 L 285 200 L 235 256 L 290 312 L 252 312 Z" fill="url(#silverGradient)"/>
    
    <!-- Central Lightning Blade -->
    <polygon points="256,180 270,240 252,246 266,310 240,260 255,254" fill="url(#goldGradient)"/>

    <!-- Spark Diamond Core -->
    <polygon points="256,230 272,256 256,282 240,256" fill="#FFFFFF"/>
  </g>

  <!-- Title Badge -->
  <rect x="156" y="360" width="200" height="34" rx="17" fill="#0B0D14" stroke="url(#goldGradient)" stroke-width="2"/>
  <text x="256" y="383" font-family="'Inter', 'Segoe UI', sans-serif" font-size="16" font-weight="900" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">KDF-TOOLS</text>
</svg>